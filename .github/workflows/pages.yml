# Publishes SecureChat Mobile (the mobile/ folder on the `mobile` branch) to GitHub Pages:
#   https://lolo737.github.io/securechat/
# Runs on every push to main, and on demand: Actions tab → "Publish phone app" → Run workflow.
name: Publish phone app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile
      - id: deployment
        uses: actions/deploy-pages@v4
